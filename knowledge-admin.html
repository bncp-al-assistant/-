  function sectionCardHtml(title, content) {
    const id = 'sec_' + Math.random().toString(36).slice(2, 8);
    return `
      <div class="section-card" id="${id}">
        <div class="section-card-header">
          <input type="text" class="section-title-input" value="${title.replace(/"/g, '&quot;')}" placeholder="예: 비상연락망">
          <button class="remove-btn" onclick="document.getElementById('${id}').remove()">삭제</button>
        </div>
        <textarea class="section-content-input">${content}</textarea>
      </div>
    `;
  }

  function renderSections(sections) {
    const container = document.getElementById('sectionsContainer');
    container.innerHTML = '';
    sections.forEach(s => {
      container.insertAdjacentHTML('beforeend', sectionCardHtml(s.title, s.content));
    });
  }

  function addSection() {
    document.getElementById('sectionsContainer').insertAdjacentHTML(
      'beforeend',
      sectionCardHtml('새 섹션', '')
    );
  }

  function collectSectionsFromForm() {
    const result = [];
    document.querySelectorAll('.section-card').forEach(card => {
      const title = card.querySelector('.section-title-input').value.trim();
      const content = card.querySelector('.section-content-input').value.trim();
      if (!title) return;
      result.push({ title, content });
    });
    return result;
  }

  async function loadCurrentKnowledge() {
    const statusBox = document.getElementById('statusBox');
    statusBox.textContent = '불러오는 중...';
    try {
      const res = await fetch(`${API_BASE}?type=knowledge_get`);
      const data = await res.json();
      if (!data.success) throw new Error(data.error || '조회 실패');
      if (data.sections && data.sections.length > 0) {
        renderSections(data.sections);
        statusBox.innerHTML = `<strong>현재 저장된 내용</strong>이 로드되었습니다. (마지막 수정: ${data.updatedAt ? new Date(data.updatedAt).toLocaleString('ko-KR') : '-'})`;
      } else {
        renderSections(SEED_SECTIONS);
        statusBox.innerHTML = '<strong>아직 저장된 내용이 없습니다.</strong> 오리엔테이션 자료를 바탕으로 기본값을 채워뒀습니다. 확인 후 필요하면 수정해서 저장하세요.';
      }
    } catch (e) {
      renderSections(SEED_SECTIONS);
      statusBox.textContent = `⚠️ 현재 저장된 내용을 불러오지 못했습니다 (${e.message}). 기본값을 채워뒀습니다.`;
    }
  }

  async function saveKnowledge() {
    const resultMsg = document.getElementById('resultMsg');
    const sections = collectSectionsFromForm();
    if (sections.length === 0) {
      resultMsg.className = 'err';
      resultMsg.textContent = '저장할 섹션이 없습니다. 최소 1개 이상 입력해주세요.';
      return;
    }
    resultMsg.className = '';
    resultMsg.textContent = '저장 중...';
    try {
      const res = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'knowledge_set', sections })
      });
      const result = await res.json();
      if (!result.success) throw new Error(result.error || '저장 실패');
      resultMsg.className = 'ok';
      resultMsg.textContent = '✅ 저장되었습니다! AI 비서가 다음 질문부터 바로 이 내용을 참고합니다.';
    } catch (e) {
      resultMsg.className = 'err';
      resultMsg.textContent = `⚠️ 저장에 실패했습니다: ${e.message}`;
    }
  }

  loadCurrentKnowledge();
</script>
