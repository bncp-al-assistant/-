<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CLUB HOUSE / Lounge 예약 신청</title>
<style>
  :root {
    --bg: #0b0b0d;
    --panel: #1a1a1e;
    --panel-border: #2c2c31;
    --field-bg: #232327;
    --text: #f2f2f0;
    --text-dim: #9a9a9f;
    --accent: #e8722c;
    --accent-dim: #7a3c17;
    --danger: #e05252;
    --danger-dim: #4a2020;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
  }

  .card {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    overflow: hidden;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid var(--panel-border);
  }

  .card-header h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  .card-header .close { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; line-height: 1; }

  .tabs { display: flex; border-bottom: 1px solid var(--panel-border); }
  .tab-btn {
    flex: 1; background: none; border: none; color: var(--text-dim);
    font-size: 14px; font-weight: 600; padding: 14px 0; cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .card-body { padding: 20px 24px 28px; }

  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }

  select, input[type="text"], input[type="number"], input[type="date"], textarea {
    width: 100%; background: var(--field-bg); border: 1px solid var(--panel-border);
    border-radius: 8px; color: var(--text); padding: 11px 12px; font-size: 14px; font-family: inherit;
  }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 90px; }

  .checkbox-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .checkbox-pill {
    display: flex; align-items: center; gap: 6px; padding: 8px 14px;
    border: 1px solid var(--accent); border-radius: 999px; cursor: pointer;
    font-size: 13px; color: var(--accent); user-select: none;
  }
  .checkbox-pill input { accent-color: var(--accent); width: 14px; height: 14px; }
  .checkbox-pill.unchecked { color: var(--text-dim); border-color: var(--panel-border); }

  .hint { font-size: 12px; color: var(--text-dim); font-weight: 400; margin-left: 6px; }

  .submit-btn {
    width: 100%; background: var(--accent); color: #1a0e05; border: none;
    border-radius: 8px; padding: 14px; font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 4px;
  }
  .submit-btn:disabled { background: var(--accent-dim); color: #cbb9a9; cursor: not-allowed; }

  .status-msg { margin-top: 10px; font-size: 13px; text-align: center; }
  .status-msg.error { color: var(--danger); }
  .status-msg.success { color: #6fcf7f; }

  .recent-section { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--panel-border); }
  .recent-section h2 { font-size: 14px; color: var(--accent); margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
  .recent-list { display: flex; flex-direction: column; gap: 10px; }
  .recent-item { background: var(--field-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 12px 14px; font-size: 13px; }
  .recent-item .top-row { display: flex; justify-content: space-between; color: var(--text); font-weight: 600; margin-bottom: 4px; }
  .recent-item .sub-row { color: var(--text-dim); }
  .empty-msg { color: var(--text-dim); font-size: 13px; }

  .filter-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .filter-row input[type="date"] { flex: 1; }
  .filter-row button {
    background: var(--field-bg); border: 1px solid var(--panel-border); color: var(--text);
    border-radius: 8px; padding: 0 16px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .filter-row button:hover { border-color: var(--accent); color: var(--accent); }

  .list-item { background: var(--field-bg); border: 1px solid var(--panel-border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .list-item .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .list-item .title { font-weight: 700; font-size: 14px; }
  .list-item .date-badge {
    font-size: 12px; color: var(--accent); background: rgba(232, 114, 44, 0.12);
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
  }
  .list-item .details { margin-top: 6px; font-size: 13px; color: var(--text-dim); line-height: 1.6; }
  .list-item .cancel-btn {
    margin-top: 10px; width: 100%; background: transparent; border: 1px solid var(--danger);
    color: var(--danger); border-radius: 8px; padding: 9px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .list-item .cancel-btn:hover { background: var(--danger-dim); }
  .list-item .cancel-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .list-item.cancelled { opacity: 0.45; }
  .list-item.cancelled .cancel-btn { display: none; }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <h1>Club House / Lounge 예약</h1>
    <button class="close" onclick="window.close && window.close()">&times;</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="apply">예약 신청</button>
    <button class="tab-btn" data-tab="manage">예약 조회 · 취소</button>
  </div>

  <div class="card-body">

    <!-- ===================== 예약 신청 탭 ===================== -->
    <div class="tab-panel active" id="tab-apply">
      <form id="reservation-form">
        <div class="field">
          <label for="team">팀명</label>
          <select id="team" required></select>
        </div>
        <div class="field">
          <label for="applicant">신청자</label>
          <input type="text" id="applicant" placeholder="이름을 입력하세요" required />
        </div>
        <div class="field">
          <label for="usageDate">이용일자</label>
          <input type="date" id="usageDate" required />
        </div>
        <div class="field">
          <label for="headcount">사용 인원수</label>
          <input type="number" id="headcount" min="1" placeholder="명" required />
        </div>
        <div class="field">
          <label for="location">장소</label>
          <select id="location" required></select>
        </div>
        <div class="field">
          <label>기본 제공 품목 <span class="hint">(필요 없으면 체크 해제)</span></label>
          <div class="checkbox-row" id="provided-items"></div>
        </div>
        <div class="field">
          <label for="additionalRequest">추가 요청사항 (선택)</label>
          <textarea id="additionalRequest" placeholder="예: 노래방 기기 사용, 음료 추가 등"></textarea>
        </div>
        <button type="submit" class="submit-btn" id="submit-btn">예약 신청</button>
        <div class="status-msg" id="status-msg"></div>
      </form>

      <div class="recent-section">
        <h2>📋 최근 예약 신청 내역</h2>
        <div class="recent-list" id="recent-list">
          <div class="empty-msg">불러오는 중...</div>
        </div>
      </div>
    </div>

    <!-- ===================== 예약 조회·취소 탭 ===================== -->
    <div class="tab-panel" id="tab-manage">
      <div class="filter-row">
        <input type="date" id="filter-date" />
        <button type="button" id="filter-apply-btn">날짜로 조회</button>
        <button type="button" id="filter-clear-btn">전체 보기</button>
      </div>
      <div class="status-msg" id="manage-status-msg"></div>
      <div id="manage-list">
        <div class="empty-msg">불러오는 중...</div>
      </div>
    </div>

  </div>
</div>

<script>
  // ⚠️ 실제 배포된 odd-butterfly-b936 Worker 주소로 반드시 교체하세요.
  // 예: "https://odd-butterfly-b936.<계정서브도메인>.workers.dev"
  const API_BASE = "https://odd-butterfly-b936.chogak1449.workers.dev/";

  const DEFAULT_META = {
    teams: ["공사팀", "사업관리팀", "관리재경팀", "경호경비팀", "이라크 지사", "기타"],
    locations: [
      "Club House Hall", "Club House 1-1", "Club House 1-2", "Club House 1-3",
      "Club House 1-4", "Club House 1-5", "Club House 1-6",
      "Lounge HB-01", "Lounge HM-20", "Lounge HM-28", "Lounge HM-29",
      "Lounge HM-30", "Lounge HM-31"
    ],
    defaultProvidedItems: ["야채", "쌈장", "기름장", "석식메뉴"]
  };

  // ---------- 탭 전환 ----------
  const tabBtns = document.querySelectorAll(".tab-btn");
  const tabPanels = {
    apply: document.getElementById("tab-apply"),
    manage: document.getElementById("tab-manage"),
  };
  tabBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      tabBtns.forEach((b) => b.classList.remove("active"));
      Object.values(tabPanels).forEach((p) => p.classList.remove("active"));
      btn.classList.add("active");
      tabPanels[btn.dataset.tab].classList.add("active");
      if (btn.dataset.tab === "manage") loadManageList();
    });
  });

  // ---------- 신청 탭 요소 ----------
  const teamSelect = document.getElementById("team");
  const locationSelect = document.getElementById("location");
  const providedItemsWrap = document.getElementById("provided-items");
  const usageDateInput = document.getElementById("usageDate");
  const statusMsg = document.getElementById("status-msg");
  const submitBtn = document.getElementById("submit-btn");
  const recentList = document.getElementById("recent-list");

  // ---------- 조회·취소 탭 요소 ----------
  const filterDateInput = document.getElementById("filter-date");
  const filterApplyBtn = document.getElementById("filter-apply-btn");
  const filterClearBtn = document.getElementById("filter-clear-btn");
  const manageStatusMsg = document.getElementById("manage-status-msg");
  const manageList = document.getElementById("manage-list");

  function fillSelect(select, options) {
    select.innerHTML = "";
    options.forEach((opt) => {
      const o = document.createElement("option");
      o.value = opt;
      o.textContent = opt;
      select.appendChild(o);
    });
  }

  function renderProvidedItems(items) {
    providedItemsWrap.innerHTML = "";
    items.forEach((item) => {
      const label = document.createElement("label");
      label.className = "checkbox-pill";
      label.innerHTML = `<input type="checkbox" value="${item}" checked /> ${item}`;
      const checkbox = label.querySelector("input");
      checkbox.addEventListener("change", () => {
        label.classList.toggle("unchecked", !checkbox.checked);
      });
      providedItemsWrap.appendChild(label);
    });
  }

  function getSelectedProvidedItems() {
    return Array.from(providedItemsWrap.querySelectorAll("input[type=checkbox]:checked")).map((el) => el.value);
  }

  // ---------- 메타데이터: GET ?type=clubhouse_meta ----------
  async function loadMeta() {
    try {
      const res = await fetch(`${API_BASE}/?type=clubhouse_meta`);
      const json = await res.json();
      if (json.success && json.meta) {
        fillSelect(teamSelect, json.meta.teams);
        fillSelect(locationSelect, json.meta.locations);
        renderProvidedItems(json.meta.defaultProvidedItems);
        return;
      }
      throw new Error("메타데이터 응답 형식 오류");
    } catch (e) {
      console.warn("메타데이터 로드 실패, 기본값 사용:", e);
      fillSelect(teamSelect, DEFAULT_META.teams);
      fillSelect(locationSelect, DEFAULT_META.locations);
      renderProvidedItems(DEFAULT_META.defaultProvidedItems);
    }
  }

  // ---------- 최근 예약 목록: GET ?type=clubhouse_list ----------
  async function loadRecentReservations() {
    try {
      const res = await fetch(`${API_BASE}/?type=clubhouse_list`);
      const json = await res.json();
      if (!json.success) throw new Error(json.error || "조회 실패");

      const items = (json.reservations || []).slice(0, 5);
      if (items.length === 0) {
        recentList.innerHTML = `<div class="empty-msg">등록된 예약이 없습니다.</div>`;
        return;
      }

      recentList.innerHTML = items.map((r) => `
        <div class="recent-item">
          <div class="top-row">
            <span>${r.team} · ${r.applicant}</span>
            <span>${r.usageDate}</span>
          </div>
          <div class="sub-row">${r.location} · ${r.headcount}명${r.additionalRequest ? " · " + r.additionalRequest : ""}</div>
        </div>`).join("");
    } catch (e) {
      console.warn("예약 내역 로드 실패:", e);
      recentList.innerHTML = `<div class="empty-msg">신청 내역을 불러오지 못했습니다.</div>`;
    }
  }

  function setStatus(message, type) {
    statusMsg.textContent = message;
    statusMsg.className = "status-msg" + (type ? " " + type : "");
  }

  // ---------- 예약 신청: POST { type: "clubhouse_reservation", data: {...} } ----------
  document.getElementById("reservation-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    setStatus("", "");

    const data = {
      team: teamSelect.value,
      applicant: document.getElementById("applicant").value.trim(),
      usageDate: usageDateInput.value,
      headcount: Number(document.getElementById("headcount").value),
      location: locationSelect.value,
      providedItems: getSelectedProvidedItems(),
      additionalRequest: document.getElementById("additionalRequest").value.trim(),
    };

    if (!data.applicant || !data.usageDate || !data.headcount) {
      setStatus("필수 항목을 모두 입력해주세요.", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "예약 신청 처리 중...";

    try {
      const res = await fetch(API_BASE, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "clubhouse_reservation", data }),
      });
      const json = await res.json();

      if (!res.ok || !json.success) {
        throw new Error(json.error || "예약 저장 중 오류가 발생했습니다.");
      }

      setStatus("예약 신청이 완료되었습니다.", "success");
      document.getElementById("reservation-form").reset();
      renderProvidedItems(DEFAULT_META.defaultProvidedItems);
      loadRecentReservations();
    } catch (err) {
      setStatus(`⚠️ ${err.message}`, "error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "예약 신청";
    }
  });

  // ---------- 조회 · 취소 탭 로직 ----------
  function setManageStatus(message, type) {
    manageStatusMsg.textContent = message;
    manageStatusMsg.className = "status-msg" + (type ? " " + type : "");
  }

  // GET ?type=clubhouse_list&date=YYYY-MM-DD
  async function loadManageList(dateFilter) {
    manageList.innerHTML = `<div class="empty-msg">불러오는 중...</div>`;
    setManageStatus("", "");

    try {
      const qs = dateFilter ? `&date=${encodeURIComponent(dateFilter)}` : "";
      const res = await fetch(`${API_BASE}/?type=clubhouse_list${qs}`);
      const json = await res.json();
      if (!json.success) throw new Error(json.error || "조회 실패");

      const items = json.reservations || [];
      if (items.length === 0) {
        manageList.innerHTML = `<div class="empty-msg">${dateFilter ? "해당 날짜에 예약이 없습니다." : "등록된 예약이 없습니다."}</div>`;
        return;
      }

      manageList.innerHTML = "";
      items.forEach((r) => {
        const el = document.createElement("div");
        el.className = "list-item";
        el.innerHTML = `
          <div class="top-row">
            <div class="title">${r.team} · ${r.applicant}</div>
            <div class="date-badge">${r.usageDate}</div>
          </div>
          <div class="details">
            장소: ${r.location}<br />
            인원: ${r.headcount}명<br />
            ${r.providedItems && r.providedItems.length ? "제공품목: " + r.providedItems.join(", ") + "<br />" : ""}
            ${r.additionalRequest ? "추가요청: " + r.additionalRequest : ""}
          </div>
          <button class="cancel-btn" data-id="${r.id}">예약 취소</button>
        `;
        manageList.appendChild(el);
      });

      manageList.querySelectorAll(".cancel-btn").forEach((btn) => {
        btn.addEventListener("click", () => handleCancel(btn));
      });
    } catch (e) {
      manageList.innerHTML = "";
      setManageStatus(`⚠️ 예약 내역을 불러오지 못했습니다: ${e.message}`, "error");
    }
  }

  // ---------- 예약 취소: POST { type: "clubhouse_reservation_cancel", id } ----------
  async function handleCancel(btn) {
    const id = btn.dataset.id;
    const listItem = btn.closest(".list-item");
    const title = listItem.querySelector(".title").textContent;

    if (!confirm(`"${title}" 예약을 취소하시겠습니까?`)) return;

    btn.disabled = true;
    btn.textContent = "취소 처리 중...";

    try {
      const res = await fetch(API_BASE, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "clubhouse_reservation_cancel", id }),
      });
      const json = await res.json();

      if (!res.ok || !json.success) {
        throw new Error(json.error || "취소 처리 중 오류가 발생했습니다.");
      }

      listItem.classList.add("cancelled");
      btn.textContent = "취소됨";
      setManageStatus("예약이 취소되었습니다.", "success");
      loadRecentReservations();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = "예약 취소";
      setManageStatus(`⚠️ ${e.message}`, "error");
    }
  }

  filterApplyBtn.addEventListener("click", () => {
    if (!filterDateInput.value) {
      setManageStatus("조회할 날짜를 선택해주세요.", "error");
      return;
    }
    loadManageList(filterDateInput.value);
  });

  filterClearBtn.addEventListener("click", () => {
    filterDateInput.value = "";
    loadManageList();
  });

  // ---------- 초기 로드 ----------
  (function init() {
    const today = new Date();
    usageDateInput.value = today.toISOString().slice(0, 10);
    loadMeta();
    loadRecentReservations();
  })();
</script>

</body>
</html>
